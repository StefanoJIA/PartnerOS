server {
    listen 80;
    server_name _;
    add_header Cache-Control "no-store";

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        try_files /site/index.html =404;
    }

    location = /partners {
        try_files /site/manufacturers.html /site/index.html;
    }

    location = /manufacturers {
        try_files /site/manufacturers.html /site/index.html;
    }
    location ~ ^/(about|service-history|services|login|change-password|products|dashboard|inventory|new-order|reference-center|customer-service|order-detail|product-detail|user-manual|product-models|order-tracking-en|cart|order-tracking|custom-product-request|order-swatch-set|product-models-hand-controls|product-models-accessories)$ {
        try_files /site/$1.html /site/index.html;
    }

    location ~ ^/(product-models|product-detail|order-detail|order-tracking)/ {
        try_files /site/$1.html /site/index.html;
    }

    location /admin {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /site/index.html;
    }
}


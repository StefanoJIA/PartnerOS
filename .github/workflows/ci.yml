name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, feat/e2e-supplier-convergence, feat/pilot-ready-revenue-loop, agent/pr-ci-readiness]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg://partneros:partneros@127.0.0.1:5435/partneros_ci
  BACKEND_BASE_URL: http://127.0.0.1:8014

jobs:
  backend:
    name: Backend pytest + migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: partneros
          POSTGRES_PASSWORD: partneros
          POSTGRES_DB: partneros_ci
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U partneros -d partneros_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Empty-database migration (alembic upgrade head)
        working-directory: backend
        run: |
          alembic upgrade head
          test "$(alembic current | tail -1 | awk '{print $1}')" = "0026_customer_project_requests"

      - name: Pytest
        working-directory: backend
        run: python -m pytest -q -rs

      - name: Release candidate contract smoke
        working-directory: backend
        run: python scripts/release_candidate_check.py

  frontend:
    name: Frontend test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, typecheck, test, build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  portal-whitelist:
    name: Portal site whitelist checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Customer portal static site checks
        run: |
          cd frontend && npm ci && npm run site:check
          python scripts/customer_portal_site_check.py
